name: Cross-platform release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/test.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            packaging/requirements-build.txt
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libportaudio2 libasound2 xvfb xauth
      - name: Install build and runtime dependencies
        run: python -m pip install -r requirements-desktop.txt -r requirements-rime.txt -r packaging/requirements-build.txt
      - name: Test frozen HTTPS gate failure handling
        run: python -m unittest tests.ota_release_smoke -v
      - name: Cache verified native dependency sources
        uses: actions/cache@v4
        with:
          path: .cache/third-party-sources
          key: native-sources-${{ runner.os }}-${{ hashFiles('packaging/pyav-sources.json', 'requirements-desktop.txt') }}
      - name: Build, relocate and smoke-test application
        env:
          SHUANGSHENG_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == "true" ]]; then
            version="$RELEASE_REF"
          else
            # Unpublished validation uses the source version so the production
            # updater can exercise its stable-version rules on these artifacts.
            version="$(python -c 'from ime import __version__; print(__version__)')"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python scripts/build_release.py --version "$version" --target '${{ matrix.target }}' --gui-smoke-test
            if [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              xvfb-run -a python tests/ota_release_smoke.py "dist/release/Shuangsheng-$version-${{ matrix.target }}.tar.gz" '${{ matrix.target }}' --https-check
            fi
          else
            python scripts/build_release.py --version "$version" --target '${{ matrix.target }}' --gui-smoke-test
            if [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              python tests/ota_release_smoke.py "dist/release/Shuangsheng-$version-${{ matrix.target }}.zip" '${{ matrix.target }}' --https-check
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Verify complete release and generate checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/build_release.py --version "$RELEASE_VERSION" --checksums-only
      - name: Stage all files, then publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          # Existing releases are immutable: a failed draft can be completed,
          # but a published release is never silently replaced by a rerun.
          if gh release view "$RELEASE_VERSION" --json isDraft > .cache-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open(".cache-release.json"))["isDraft"], "Release already published; use a new version tag"'
          else
            gh release create "$RELEASE_VERSION" --verify-tag --draft --title "Shuangsheng $RELEASE_VERSION" --notes-file packaging/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_VERSION" dist/release/* --clobber
          gh release edit "$RELEASE_VERSION" --draft=false
