# Authored Shuangsheng schema; MIT. See project LICENSE.
schema:
  schema_id: shuangsheng_jyutping
  name: 双声粤拼
  version: '1.0'
  author:
  - Shuangsheng contributors
  description: Verified CanCLID Jyutping readings, numbered tones or toneless input;
    private learning dictionary.
switches:
- name: ascii_mode
  reset: 0
  states:
  - 中文
  - English
- name: full_shape
  states:
  - 半角
  - 全角
- name: simplification
  reset: 1
  states:
  - 繁體
  - 简体
- name: ascii_punct
  states:
  - 。，
  - ．，
engine:
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - script_translator
  filters:
  - simplifier
  - uniquifier
menu:
  page_size: 9
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz123456
  delimiter: ' '''
  algebra:
  - derive/[1-6]//
  - abbrev/^([a-z]).+$/$1/
translator:
  dictionary: shuangsheng_jyutping
  prism: shuangsheng_jyutping
  user_dict: shuangsheng_jyutping
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
key_binder:
  bindings:
  - when: always
    accept: Control+Shift+4
    toggle: simplification
  - when: always
    accept: Control+Shift+dollar
    toggle: simplification
  - when: has_menu
    accept: minus
    send: Page_Up
  - when: has_menu
    accept: equal
    send: Page_Down
  - when: paging
    accept: comma
    send: Page_Up
  - when: has_menu
    accept: period
    send: Page_Down
  - when: has_menu
    accept: Alt+1
    send: Control+1
  - when: has_menu
    accept: Alt+2
    send: Control+2
  - when: has_menu
    accept: Alt+3
    send: Control+3
  - when: has_menu
    accept: Alt+4
    send: Control+4
  - when: has_menu
    accept: Alt+5
    send: Control+5
  - when: has_menu
    accept: Alt+6
    send: Control+6
  - when: has_menu
    accept: Alt+7
    send: Control+7
  - when: has_menu
    accept: Alt+8
    send: Control+8
  - when: has_menu
    accept: Alt+9
    send: Control+9
recognizer:
  patterns:
    email: ^[A-Za-z][-_.0-9A-Za-z]*@.*$
    uppercase: '[A-Z][-_+.''0-9A-Za-z]*$'
    url: ^(www[.]|https?:|ftp:|mailto:).*$
punctuator:
  full_shape:
    ' ':
      commit: 　
    ',':
      commit: ，
    .:
      commit: 。
    '?':
      commit: ？
    '!':
      commit: ！
    ':':
      commit: ：
    ;:
      commit: ；
    '''':
      pair:
      - ‘
      - ’
    '"':
      pair:
      - “
      - ”
    (: （
    ): ）
    '[': 【
    ']': 】
    <: 《
    '>': 》
    /: ／
    \: 、
    '-': －
    _: ——
    +: ＋
    '=': ＝
    '@': ＠
    '#': ＃
    $: ￥
    '%': ％
    ^: ……
    '&': ＆
    '*': ＊
    '`': ｀
    '~': ～
  half_shape:
    ',':
      commit: ，
    .:
      commit: 。
    '?':
      commit: ？
    '!':
      commit: ！
    ':':
      commit: ：
    ;:
      commit: ；
    '''':
      pair:
      - ‘
      - ’
    '"':
      pair:
      - “
      - ”
    (: （
    ): ）
    '[': 【
    ']': 】
    <: 《
    '>': 》
    \: 、
    _: ——
    ^: ……
