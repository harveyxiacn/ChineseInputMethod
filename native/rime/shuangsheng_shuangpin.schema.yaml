translator:
  dictionary: shuangsheng
  prism: shuangsheng_shuangpin
  user_dict: shuangsheng_shuangpin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
key_binder:
  bindings:
  - when: always
    accept: Control+Shift+4
    toggle: simplification
  - when: always
    accept: Control+Shift+dollar
    toggle: simplification
  - when: has_menu
    accept: minus
    send: Page_Up
  - when: has_menu
    accept: equal
    send: Page_Down
  - when: paging
    accept: comma
    send: Page_Up
  - when: has_menu
    accept: period
    send: Page_Down
recognizer:
  patterns:
    email: ^[A-Za-z][-_.0-9A-Za-z]*@.*$
    uppercase: '[A-Z][-_+.''0-9A-Za-z]*$'
    url: ^(www[.]|https?:|ftp:|mailto:).*$
punctuator:
  full_shape:
    ' ':
      commit: 　
    ',':
      commit: ，
    .:
      commit: 。
    '?':
      commit: ？
    '!':
      commit: ！
    ':':
      commit: ：
    ;:
      commit: ；
    '''':
      pair:
      - ‘
      - ’
    '"':
      pair:
      - “
      - ”
    (: （
    ): ）
    '[': 【
    ']': 】
    <: 《
    '>': 》
    /: ／
    \: 、
    '-': －
    _: ——
    +: ＋
    '=': ＝
    '@': ＠
    '#': ＃
    $: ￥
    '%': ％
    ^: ……
    '&': ＆
    '*': ＊
    '`': ｀
    '~': ～
  half_shape:
    ',':
      commit: ，
    .:
      commit: 。
    '?':
      commit: ？
    '!':
      commit: ！
    ':':
      commit: ：
    ;:
      commit: ；
    '''':
      pair:
      - ‘
      - ’
    '"':
      pair:
      - “
      - ”
    (: （
    ): ）
    '[': 【
    ']': 】
    <: 《
