# Authored Shuangsheng schema; MIT. See project LICENSE.
schema:
  schema_id: shuangsheng_shuangpin
  name: 双声小鹤双拼
  version: '1.0'
  author:
  - Shuangsheng contributors
  description: Xiaohe double pinyin with sentence composition and a private learning
    dictionary.
switches:
- name: ascii_mode
  reset: 0
  states:
  - 中文
  - English
- name: full_shape
  states:
  - 半角
  - 全角
- name: simplification
  reset: 1
  states:
  - 繁體
  - 简体
- name: ascii_punct
  states:
  - 。，
  - ．，
engine:
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - script_translator
  filters:
  - simplifier
  - uniquifier
menu:
  page_size: 9
